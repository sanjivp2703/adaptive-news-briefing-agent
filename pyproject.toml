[project]
name = "conversational-agent"
version = "0.1.0"
description = "Keeps a user conversant with the groups they care about: watches the news per group, briefs plainly, answers follow-ups, and tracks what the user knows as a concept ledger."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
news-agent = "conversational_agent.cli:main"
news-agent-web = "conversational_agent.web.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conversational_agent = ["prompts/*.md", "web/static/*", "web/demo_store.sql"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["harness/personas/research", "training/notebooks"]

[tool.ruff.lint]
# Correctness and import hygiene. Formatting is left alone on purpose: the
# code is hand-wrapped around long explanatory comments.
select = ["E9", "F", "I", "B", "UP", "RUF100"]
ignore = [
    "B905",  # zip() without strict=: the pairs here are built together
]
