<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13"><title id="t">Ledger precision by state at checkpoint 5</title><desc id="d">unknown 22 of 23, confirmed 6 of 8, explained after two reads 2 of 3, familiar after two reads 2 of 3, explained after one read 2 of 8, provisional 2 of 9, familiar after one read 2 of 32.</desc><rect width="720" height="360" fill="#fcfcfb" rx="8"/><text x="20.0" y="28.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">How often each ledger state is right (checkpoint 5)</text><text x="20.0" y="48.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">Terms the system believed were in a state, checked against what the persona really knew.</text><line x1="200.0" x2="200.0" y1="74" y2="320" stroke="#e6e4df"/><text x="200.0" y="70.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">0%</text><line x1="300.0" x2="300.0" y1="74" y2="320" stroke="#e6e4df"/><text x="300.0" y="70.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">25%</text><line x1="400.0" x2="400.0" y1="74" y2="320" stroke="#e6e4df"/><text x="400.0" y="70.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">50%</text><line x1="500.0" x2="500.0" y1="74" y2="320" stroke="#e6e4df"/><text x="500.0" y="70.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">75%</text><line x1="600.0" x2="600.0" y1="74" y2="320" stroke="#e6e4df"/><text x="600.0" y="70.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">100%</text><text x="188.0" y="101.1" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">unknown</text><rect x="200" y="90.14285714285714" width="382.6" height="14" rx="3" fill="#2a78d6"/><text x="590.6" y="101.1" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">22/23</text><text x="188.0" y="135.4" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">confirmed</text><rect x="200" y="124.42857142857142" width="300.0" height="14" rx="3" fill="#2a78d6"/><text x="508.0" y="135.4" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">6/8</text><text x="188.0" y="169.7" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">explained, 2+ reads</text><rect x="200" y="158.7142857142857" width="266.7" height="14" rx="3" fill="#2a78d6"/><text x="474.7" y="169.7" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">2/3</text><text x="188.0" y="204.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">familiar, 2+ reads</text><rect x="200" y="193.0" width="266.7" height="14" rx="3" fill="#2a78d6"/><text x="474.7" y="204.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">2/3</text><text x="188.0" y="238.3" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">explained, 1 read</text><rect x="200" y="227.28571428571428" width="100.0" height="14" rx="3" fill="#2a78d6"/><text x="308.0" y="238.3" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">2/8</text><text x="188.0" y="272.6" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">provisional</text><rect x="200" y="261.57142857142856" width="88.9" height="14" rx="3" fill="#2a78d6"/><text x="296.9" y="272.6" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">2/9</text><text x="188.0" y="306.9" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">familiar, 1 read</text><rect x="200" y="295.8571428571429" width="25.0" height="14" rx="3" fill="#2a78d6"/><text x="233.0" y="306.9" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">2/32</text><text x="20.0" y="344.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">'unknown' is almost always right. A term glossed once in a skimmed briefing is usually still unknown,</text><text x="20.0" y="358.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">which is why that state stays out of the proficiency band until a second read.</text></svg>
