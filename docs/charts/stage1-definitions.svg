<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13"><title id="t">Definitions per 100 words by reader profile, three models</title><desc id="d">The untuned base defines far more than the teacher for every profile; the fine-tuned student defines less than the teacher for every profile.</desc><rect width="720" height="340" fill="#fcfcfb" rx="8"/><text x="20.0" y="28.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">Definitions per 100 words, by reader profile, across training stages</text><text x="20.0" y="48.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">How often each model stops to define a term. The teacher defines most for beginners and least for experts.</text><line x1="60" x2="690" y1="262.0" y2="262.0" stroke="#e6e4df"/><text x="52.0" y="266.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal">0</text><line x1="60" x2="690" y1="201.6" y2="201.6" stroke="#e6e4df"/><text x="52.0" y="205.6" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal">2</text><line x1="60" x2="690" y1="141.3" y2="141.3" stroke="#e6e4df"/><text x="52.0" y="145.3" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal">4</text><rect x="72.0" y="153.3" width="23.5" height="108.7" rx="2" fill="#b9b6ad"/><text x="83.8" y="149.3" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">3.6</text><rect x="97.5" y="232.7" width="23.5" height="29.3" rx="2" fill="#2a78d6"/><text x="109.2" y="228.7" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">1.0</text><rect x="123.0" y="257.2" width="23.5" height="4.8" rx="2" fill="#1baf7a"/><text x="134.8" y="253.2" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">0.2</text><rect x="148.5" y="217.6" width="23.5" height="44.4" rx="2" fill="#eb6834"/><text x="160.2" y="213.6" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">1.5</text><text x="123.0" y="278.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Beginner</text><rect x="198.0" y="204.0" width="23.5" height="58.0" rx="2" fill="#b9b6ad"/><text x="209.8" y="200.0" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">1.9</text><rect x="223.5" y="256.9" width="23.5" height="5.1" rx="2" fill="#2a78d6"/><text x="235.2" y="252.9" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">0.2</text><rect x="249.0" y="262.0" width="23.5" height="0.0" rx="2" fill="#1baf7a"/><text x="260.8" y="258.0" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">0.0</text><rect x="274.5" y="212.8" width="23.5" height="49.2" rx="2" fill="#eb6834"/><text x="286.2" y="208.8" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">1.6</text><text x="249.0" y="278.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Partway in</text><rect x="324.0" y="199.2" width="23.5" height="62.8" rx="2" fill="#b9b6ad"/><text x="335.8" y="195.2" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">2.1</text><rect x="349.5" y="239.1" width="23.5" height="22.9" rx="2" fill="#2a78d6"/><text x="361.2" y="235.1" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">0.8</text><rect x="375.0" y="262.0" width="23.5" height="0.0" rx="2" fill="#1baf7a"/><text x="386.8" y="258.0" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">0.0</text><rect x="400.5" y="218.8" width="23.5" height="43.2" rx="2" fill="#eb6834"/><text x="412.2" y="214.8" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">1.4</text><text x="375.0" y="278.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Expert in</text><text x="375.0" y="290.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">one area</text><rect x="450.0" y="105.6" width="23.5" height="156.4" rx="2" fill="#b9b6ad"/><text x="461.8" y="101.6" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">5.2</text><rect x="475.5" y="262.0" width="23.5" height="0.0" rx="2" fill="#2a78d6"/><text x="487.2" y="258.0" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">0.0</text><rect x="501.0" y="262.0" width="23.5" height="0.0" rx="2" fill="#1baf7a"/><text x="512.8" y="258.0" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">0.0</text><rect x="526.5" y="245.4" width="23.5" height="16.6" rx="2" fill="#eb6834"/><text x="538.2" y="241.4" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">0.6</text><text x="501.0" y="278.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Expert</text><rect x="576.0" y="230.3" width="23.5" height="31.7" rx="2" fill="#b9b6ad"/><text x="587.8" y="226.3" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">1.1</text><rect x="601.5" y="254.2" width="23.5" height="7.8" rx="2" fill="#2a78d6"/><text x="613.2" y="250.2" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">0.3</text><rect x="627.0" y="262.0" width="23.5" height="0.0" rx="2" fill="#1baf7a"/><text x="638.8" y="258.0" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">0.0</text><rect x="652.5" y="246.6" width="23.5" height="15.4" rx="2" fill="#eb6834"/><text x="664.2" y="242.6" font-size="9" fill="#52514e" text-anchor="middle" font-weight="normal">0.5</text><text x="627.0" y="278.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Returning reader</text><rect x="60" y="64" width="12" height="7" rx="2" fill="#b9b6ad"/><text x="78.0" y="71.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">untuned base</text><rect x="160.4" y="64" width="12" height="7" rx="2" fill="#2a78d6"/><text x="178.4" y="71.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">fine-tuned student</text><rect x="298.0" y="64" width="12" height="7" rx="2" fill="#1baf7a"/><text x="316.0" y="71.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">stage 2 (DPO, first pass)</text><rect x="479.0" y="64" width="12" height="7" rx="2" fill="#eb6834"/><text x="497.0" y="71.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">teacher</text><text x="20.0" y="312.0" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="normal">Untuned: too many. Stage 1: too few. First DPO pass: none at all, from a pair set that leaned toward fewer definitions.</text></svg>
