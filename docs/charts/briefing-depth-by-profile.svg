<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13"><title id="t">Briefing depth by reader profile</title><desc id="d">Reading grade level rises from about 10 for beginners to about 12.6 for experts, while definitions per 100 words fall from about 1.5 to about 0.45.</desc><rect width="720" height="330" fill="#fcfcfb" rx="8"/><text x="20.0" y="28.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">The same event, briefed for five kinds of reader (prompt v7, teacher data)</text><text x="20.0" y="48.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">Mean over 452 generated briefings across 56 real events, grouped by the reader state the packet described.</text><text x="40.0" y="86.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Reading grade level</text><rect x="40.0" y="154.0" width="50.0" height="116.0" rx="3" fill="#2a78d6"/><text x="65.0" y="148.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">10.0</text><text x="65.0" y="286.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Beginner</text><rect x="100.0" y="130.6" width="50.0" height="139.4" rx="3" fill="#2a78d6"/><text x="125.0" y="124.6" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">12.1</text><text x="125.0" y="286.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Partway in</text><rect x="160.0" y="131.4" width="50.0" height="138.6" rx="3" fill="#2a78d6"/><text x="185.0" y="125.4" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">12.0</text><text x="185.0" y="286.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Expert in</text><text x="185.0" y="298.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">one area</text><rect x="220.0" y="122.2" width="50.0" height="147.8" rx="3" fill="#2a78d6"/><text x="245.0" y="116.2" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">12.8</text><text x="245.0" y="286.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Expert</text><rect x="280.0" y="123.6" width="50.0" height="146.4" rx="3" fill="#2a78d6"/><text x="305.0" y="117.6" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">12.7</text><text x="305.0" y="286.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Returning reader</text><line x1="40" x2="340" y1="270" y2="270" stroke="#e6e4df"/><text x="400.0" y="86.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Definitions per 100 words</text><rect x="400.0" y="122.2" width="50.0" height="147.8" rx="3" fill="#eb6834"/><text x="425.0" y="116.2" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">1.57</text><text x="425.0" y="286.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Beginner</text><rect x="460.0" y="159.8" width="50.0" height="110.2" rx="3" fill="#eb6834"/><text x="485.0" y="153.8" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">1.17</text><text x="485.0" y="286.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Partway in</text><rect x="520.0" y="161.7" width="50.0" height="108.3" rx="3" fill="#eb6834"/><text x="545.0" y="155.7" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">1.15</text><text x="545.0" y="286.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Expert in</text><text x="545.0" y="298.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">one area</text><rect x="580.0" y="225.7" width="50.0" height="44.3" rx="3" fill="#eb6834"/><text x="605.0" y="219.7" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">0.47</text><text x="605.0" y="286.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Expert</text><rect x="640.0" y="206.9" width="50.0" height="63.1" rx="3" fill="#eb6834"/><text x="665.0" y="200.9" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">0.67</text><text x="665.0" y="286.0" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">Returning reader</text><line x1="400" x2="700" y1="270" y2="270" stroke="#e6e4df"/><text x="20.0" y="312.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Beginners get the simplest prose and the most definitions. Experts get denser prose and almost none.</text></svg>
