<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13"><title id="t">Stage 1 hard rules before and after fine-tuning</title><desc id="d">On 45 held-out packets the untuned model passes every rule on 30, the fine-tuned student on 40, the teacher on 45.</desc><rect width="720" height="400" fill="#fcfcfb" rx="8"/><text x="20.0" y="28.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">Stage 1: hard rules passed on the 45 held-out packets</text><text x="20.0" y="48.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">Same packets, same checks the training data was filtered with. Untuned model vs fine-tuned vs the teacher.</text><line x1="230.0" x2="230.0" y1="78" y2="350" stroke="#e6e4df"/><text x="230.0" y="74.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">0/45</text><line x1="366.7" x2="366.7" y1="78" y2="350" stroke="#e6e4df"/><text x="366.7" y="74.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">15/45</text><line x1="503.3" x2="503.3" y1="78" y2="350" stroke="#e6e4df"/><text x="503.3" y="74.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">30/45</text><line x1="640.0" x2="640.0" y1="78" y2="350" stroke="#e6e4df"/><text x="640.0" y="74.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">45/45</text><text x="218.0" y="103.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">valid JSON answer</text><rect x="230" y="88.0" width="382.7" height="7" rx="2" fill="#b9b6ad"/><rect x="230" y="97.0" width="410.0" height="7" rx="2" fill="#2a78d6"/><text x="646.0" y="104.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">45</text><rect x="230" y="106.0" width="410.0" height="7" rx="2" fill="#eb6834"/><text x="218.0" y="141.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">no question mark</text><rect x="230" y="126.0" width="410.0" height="7" rx="2" fill="#b9b6ad"/><rect x="230" y="135.0" width="410.0" height="7" rx="2" fill="#2a78d6"/><text x="646.0" y="142.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">45</text><rect x="230" y="144.0" width="410.0" height="7" rx="2" fill="#eb6834"/><text x="218.0" y="179.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">only the packet's event</text><rect x="230" y="164.0" width="382.7" height="7" rx="2" fill="#b9b6ad"/><rect x="230" y="173.0" width="410.0" height="7" rx="2" fill="#2a78d6"/><text x="646.0" y="180.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">45</text><rect x="230" y="182.0" width="410.0" height="7" rx="2" fill="#eb6834"/><text x="218.0" y="217.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">every number in the source</text><rect x="230" y="202.0" width="400.9" height="7" rx="2" fill="#b9b6ad"/><rect x="230" y="211.0" width="391.8" height="7" rx="2" fill="#2a78d6"/><text x="627.8" y="218.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">43</text><rect x="230" y="220.0" width="410.0" height="7" rx="2" fill="#eb6834"/><text x="218.0" y="255.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">no re-glossed known term</text><rect x="230" y="240.0" width="309.8" height="7" rx="2" fill="#b9b6ad"/><rect x="230" y="249.0" width="382.7" height="7" rx="2" fill="#2a78d6"/><text x="618.7" y="256.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">42</text><rect x="230" y="258.0" width="410.0" height="7" rx="2" fill="#eb6834"/><text x="218.0" y="293.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">explained ⊆ used</text><rect x="230" y="278.0" width="410.0" height="7" rx="2" fill="#b9b6ad"/><rect x="230" y="287.0" width="410.0" height="7" rx="2" fill="#2a78d6"/><text x="646.0" y="294.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">45</text><rect x="230" y="296.0" width="410.0" height="7" rx="2" fill="#eb6834"/><text x="218.0" y="331.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600">all rules</text><rect x="230" y="316.0" width="273.3" height="7" rx="2" fill="#b9b6ad"/><text x="509.3" y="323.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">30</text><rect x="230" y="325.0" width="364.4" height="7" rx="2" fill="#2a78d6"/><text x="600.4" y="332.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">40</text><rect x="230" y="334.0" width="410.0" height="7" rx="2" fill="#eb6834"/><text x="646.0" y="341.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">45</text><rect x="230" y="364" width="12" height="7" rx="2" fill="#b9b6ad"/><text x="248.0" y="371.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">untuned base</text><rect x="340" y="364" width="12" height="7" rx="2" fill="#2a78d6"/><text x="358.0" y="371.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">fine-tuned student</text><rect x="490" y="364" width="12" height="7" rx="2" fill="#eb6834"/><text x="508.0" y="371.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">teacher (Claude Sonnet)</text><text x="20.0" y="392.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">All rules at once: 30 of 45 before fine-tuning, 40 of 45 after; the teacher's answers pass 45 of 45 by construction.</text></svg>
