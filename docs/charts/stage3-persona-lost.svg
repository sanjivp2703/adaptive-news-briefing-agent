<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13"><title id="t">Words that lost the reader per briefing, by profile: round 2, round 3, Claude</title><desc id="d">Round 3 lowers words lost for every profile except returning readers; Claude is lowest for beginners and partway readers, the student is lowest for experts.</desc><rect width="720" height="340" fill="#fcfcfb" rx="8"/><text x="20.0" y="28.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">Words that lost the reader, per briefing, by reader profile</text><text x="20.0" y="48.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">Claude reads each held-out briefing as the matching persona and lists the words it would not follow. Lower is better.</text><line x1="60" x2="690" y1="262.0" y2="262.0" stroke="#e6e4df"/><text x="52.0" y="266.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal">0</text><line x1="60" x2="690" y1="227.6" y2="227.6" stroke="#e6e4df"/><text x="52.0" y="231.6" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal">1</text><line x1="60" x2="690" y1="193.2" y2="193.2" stroke="#e6e4df"/><text x="52.0" y="197.2" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal">2</text><line x1="60" x2="690" y1="158.8" y2="158.8" stroke="#e6e4df"/><text x="52.0" y="162.8" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal">3</text><line x1="60" x2="690" y1="124.4" y2="124.4" stroke="#e6e4df"/><text x="52.0" y="128.4" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal">4</text><line x1="60" x2="690" y1="90.0" y2="90.0" stroke="#e6e4df"/><text x="52.0" y="94.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal">5</text><rect x="72.0" y="105.1" width="32.0" height="156.9" rx="2" fill="#9cc3ee"/><text x="88.0" y="101.1" f